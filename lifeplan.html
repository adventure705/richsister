<body>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCK_FPWI4TIDOJQ1TQ1lYN-QwO-D1Gw2fg",
      authDomain: "richsister-5cf8c.firebaseapp.com",
      projectId: "richsister-5cf8c",
      storageBucket: "richsister-5cf8c.firebasestorage.app",
      messagingSenderId: "773702207866",
      appId: "1:773702207866:web:87e277b70f7bf188892ec3",
      measurementId: "G-B51PDEQYX9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // 리액트 컴포넌트에서 접근할 수 있도록 전역에 노출
    window.fb = {
      auth,
      db,
      provider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    };

    // 로드 완료 이벤트 발생 (옵션)
    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // 아이콘 컴포넌트 (안전 모드)
    const Icon = ({ name, size = 20, className = "" }) => {
      const emojis = {
        'save': '💾', 'table-2': '📊', 'image-plus': '🖼️',
        'cloud-download': '☁️', 'log-out': '🚪', 'log-in': '🔑',
        'layers': '➕', 'history': '🕒', 'sun': '☀️', 'moon': '🌙',
        'book-open': '📖', 'calendar': '📅', 'user': '👤',
        'check-circle': '✅', 'alert-triangle': '⚠️', 'info': 'ℹ️', 'database-zap': '⚡', 'cpu': '🤖',
        'chevron-left': '◀️', 'chevron-right': '▶️', 'x': '❌', 'loader': '🔄', 'cloud': '☁️',
        'grip-vertical': '⠿', 'trash-2': '🗑️', 'plus': '➕', 'refresh-cw': '🔄', 'edit-3': '📝',
        'target': '🎯', 'map': '🗺️', 'trending-up': '📈', 'wallet': '👛', 'coins': '💰'
      };
      // 우선 화면 복구를 위해 SVG 렌더링을 중단하고 이모지만 보여줍니다.
      return <span style={{ fontSize: size, lineHeight: 1 }} className={className}>{emojis[name] || ''}</span>;
    };

    // 모달 컴포넌트
    const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-md" }) => {
      useEffect(() => {
        const handleEsc = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (isOpen) window.addEventListener('keydown', handleEsc);
        return () => window.removeEventListener('keydown', handleEsc);
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay overflow-y-auto" onClick={onClose}>
          <div
            className={`bg-white dark:bg-slate-900 rounded-[2rem] w-full ${maxWidth} shadow-2xl animate-in overflow-hidden border border-slate-200 dark:border-slate-800`}
            onClick={e => e.stopPropagation()}
          >
            {title && (
              <div className="px-8 py-6 border-b border-slate-100 dark:border-brand-900/30 flex justify-between items-center bg-brand-50/30 dark:bg-brand-950/40">
                <h3 className="text-xl font-black text-brand-700 dark:text-brand-300">{title}</h3>
                <button onClick={onClose} className="text-brand-400 hover:text-brand-600 dark:hover:text-brand-200 transition-colors">
                  <Icon name="x" size={24} />
                </button>
              </div>
            )}
            <div className={title ? "p-8" : "p-2"}>
              {!title && (
                <button onClick={onClose} className="absolute top-6 right-6 z-10 bg-black/50 text-white p-2 rounded-full hover:bg-black/70 transition-colors">
                  <Icon name="x" size={24} />
                </button>
              )}
              {children}
            </div>

          </div>

        </div>
      );
    };

    const App = () => {
      const roadmapRef = useRef(null);
      const fileInputRef = useRef(null);

      const [activeCell, setActiveCell] = useState(null);
      const [darkMode, setDarkMode] = useState(false);

      // Firebase User State
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthChecking, setIsAuthChecking] = useState(true);

      // Firestore 저장/로드 헬퍼 함수
      // Firestore 저장/로드 헬퍼 함수
      const saveToFirestore = async (user, data) => {
        if (!user || !window.fb) throw new Error("로그인이 필요합니다.");

        // 데이터 크기 대략적 체크 (Firestore 1MB 제한)
        const jsonString = JSON.stringify(data);
        const sizeInBytes = new Blob([jsonString]).size;
        if (sizeInBytes > 1000000) {
          throw new Error(`데이터 용량이 너무 큽니다 (${(sizeInBytes / 1024 / 1024).toFixed(2)}MB).\n이미지를 줄이거나 삭제해주세요. (최대 1MB)`);
        }

        const docRef = window.fb.doc(window.fb.db, "users", user.uid);
        await window.fb.setDoc(docRef, {
          roadmap: data,
          updatedAt: new Date().toISOString(),
          uid: user.uid,
          email: user.email
        }, { merge: true });
      };

      // 데이터 적용 헬퍼 함수
      const applyDataToState = (data) => {
        if (!data) return;
        if (data.pageTitle) setPageTitle(data.pageTitle);
        if (data.pageSubtitle) setPageSubtitle(data.pageSubtitle);
        if (data.startAge) setStartAge(data.startAge);
        if (data.startYear) setStartYear(data.startYear);
        if (data.defaultReturn) setDefaultReturn(data.defaultReturn);
        if (data.defaultSavings) setDefaultSavings(data.defaultSavings);
        if (data.goalTitle) setGoalTitle(data.goalTitle);
        if (data.goalQuote) setGoalQuote(data.goalQuote);
        if (data.savingsUnit) setSavingsUnit(data.savingsUnit);
        setRoadmapYears(Number(data.roadmapYears) >= 30 ? Number(data.roadmapYears) : 30);
        if (data.allRows) {
          let rows = data.allRows.filter(r => r.id !== 'investedAssets');
          if (!rows.find(r => r.id === 'profit')) {
            const trIdx = rows.findIndex(r => r.id === 'targetReturn');
            if (trIdx !== -1) {
              rows.splice(trIdx + 1, 0, { id: 'profit', label: '수익금', type: 'calculated', isSystem: true });
            }
          }
          setAllRows(rows);
        }
        if (data.items) setItems(data.items);
        if (data.yearDataStore) setYearDataStore(data.yearDataStore);
        if (data.darkMode !== undefined) setDarkMode(data.darkMode);
      };

      // App 내부에서 사용할 로드 함수 (수동 로드용)
      const loadFromFirestore = async (user, isManual = false) => {
        if (!user || !window.fb) return;
        if (isManual) {
          setModalState({ type: 'status', data: { title: "데이터 불러오는 중", msg: "클라우드에서 데이터를 찾고 있습니다...", icon: "loader", animate: true } });
        }

        try {
          const docRef = window.fb.doc(window.fb.db, "users", user.uid);
          const docSnap = await window.fb.getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data().roadmap;
            if (data) {
              applyDataToState(data);
              setModalState({ type: 'status', data: { title: "동기화 완료", msg: "클라우드에서 최신 데이터를 불러왔습니다.", icon: "cloud" } });
            }
          } else {
            if (isManual) {
              setModalState({ type: 'status', data: { title: "데이터 없음", msg: "서버에 저장된 데이터가 없습니다.\n먼저 [저장]을 해주세요.", icon: "alert-circle" } });
            }
          }
        } catch (e) {
          console.error("Firestore load error:", e);
          if (isManual || e.code === 'permission-denied') {
            setModalState({ type: 'status', data: { title: "불러오기 실패", msg: `오류가 발생했습니다: ${e.message}\n(권한 문제일 경우 Firebase Console 규칙을 확인하세요)`, icon: "alert-triangle" } });
          }
        }
      };

      useEffect(() => {
        let unsubscribeSnapshot = null;
        let isInitialDocLoaded = false;

        const initFirebase = () => {
          if (window.fb) {
            // [안정성 최적화] 리디렉션과 인증 상태를 가장 표준적이고 안정적인 방식으로 처리
            window.fb.onAuthStateChanged(window.fb.auth, (user) => {
              if (user) {
                setCurrentUser(user);
                if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }

                const docRef = window.fb.doc(window.fb.db, "users", user.uid);
                unsubscribeSnapshot = window.fb.onSnapshot(docRef, (doc) => {
                  if (doc.exists()) {
                    applyDataToState(doc.data().roadmap);
                  } else if (!isInitialDocLoaded) {
                    resetState();
                  }

                  if (!isInitialDocLoaded) {
                    setIsAuthChecking(false);
                    isInitialDocLoaded = true;
                  }
                }, (error) => {
                  console.error("Firestore sync error:", error);
                  if (!isInitialDocLoaded) { setIsAuthChecking(false); isInitialDocLoaded = true; }
                });
              } else {
                // 사용자가 없는 상태라면 리디렉션 인증 결과가 있었는지 최종 확인
                window.fb.getRedirectResult(window.fb.auth)
                  .then((result) => {
                    // 리디렉션 결과도 없다면 그제서야 로딩 화면 해제 (로그인 화면 보여줌)
                    if (!result || !result.user) {
                      setIsAuthChecking(false);
                    }
                    // result.user가 있다면 곧 onAuthStateChanged가 user와 함께 다시 호출됨
                  })
                  .catch((error) => {
                    console.error("Redirect check error:", error);
                    setIsAuthChecking(false);
                  });
              }
            });
          } else {
            // Firebase 로드 대기
            setTimeout(initFirebase, 50);
          }
        };
        initFirebase();

        return () => {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        };
      }, []);

      const handleLogin = async () => {
        if (!window.fb) return;
        try {
          // [해결] 무조건적인 리디렉션 대신 팝업을 먼저 시도하여 속도를 높입니다.
          // 모바일 환경에서도 최신 브라우저는 팝업을 잘 지원하며 훨씬 빠릅니다.
          await window.fb.signInWithPopup(window.fb.auth, window.fb.provider);
        } catch (error) {
          // 팝업이 차단된 경우에만 리디렉션으로 자동 전환 (안전장치)
          if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request' || error.code === 'auth/popup-closed-by-user') {
            await window.fb.signInWithRedirect(window.fb.auth, window.fb.provider);
          } else {
            console.error("Login Error:", error);
            setModalState({ type: 'status', data: { title: "로그인 실패", msg: error.message, icon: "alert-triangle" } });
          }
        }
      };

      const resetState = () => {
        setPageTitle('인생 로드맵 30년 시나리오');
        setPageSubtitle('원하는 연도와 나이로 당신의 30년을 그려보세요.');
        setStartAge(30);
        setStartYear(new Date().getFullYear());
        setDefaultReturn(15);
        setDefaultSavings(820);
        setGoalTitle('나의 인생 목표');
        setGoalQuote('"성공은 계획에서 시작된다"');
        setSavingsUnit('만원');
        setAllRows([
          { id: 'beginningAssets', label: '연초자산', type: 'number', isSystem: true },
          { id: 'targetReturn', label: '수익률 (%)', type: 'number', isSystem: true },
          { id: 'profit', label: '수익금', type: 'calculated', isSystem: true },
          { id: 'savings', label: '저축액', type: 'number', isSystem: true },
          { id: 'yearEndAssets', label: '연말자산', type: 'calculated', isSystem: true },
          { id: 'lifePlan', label: '라이프 플랜', type: 'textarea' },
          { id: 'visualization', label: '시각화', type: 'image' }
        ]);
        setYearDataStore({});
        setRoadmapYears(30);
        setDarkMode(false);
      };



      // 헤더 및 안내 문구 상태
      const [pageTitle, setPageTitle] = useState('인생 로드맵 30년 시나리오');
      const [pageSubtitle, setPageSubtitle] = useState('원하는 연도와 나이로 당신의 30년을 그려보세요.');

      const [startAge, setStartAge] = useState(30);
      const [startYear, setStartYear] = useState(new Date().getFullYear());
      const [defaultReturn, setDefaultReturn] = useState(15);
      const [defaultSavings, setDefaultSavings] = useState(820);
      const [goalTitle, setGoalTitle] = useState('나의 인생 목표');
      const [goalQuote, setGoalQuote] = useState('"성공은 계획에서 시작된다"');
      const [savingsUnit, setSavingsUnit] = useState('만원');

      const [allRows, setAllRows] = useState([
        { id: 'beginningAssets', label: '연초자산', type: 'number', isSystem: true },
        { id: 'targetReturn', label: '수익률 (%)', type: 'number', isSystem: true },
        { id: 'profit', label: '수익금', type: 'calculated', isSystem: true },
        { id: 'savings', label: '저축액', type: 'number', isSystem: true },
        { id: 'yearEndAssets', label: '연말자산', type: 'calculated', isSystem: true },
        { id: 'lifePlan', label: '라이프 플랜', type: 'textarea' },
        { id: 'visualization', label: '시각화', type: 'image' }
      ]);

      // 연도별 데이터 마스터 저장소 (연도 이동 시 복원용)
      const [yearDataStore, setYearDataStore] = useState({});
      const [roadmapYears, setRoadmapYears] = useState(30);

      // 실행 취소 / 다시 실행 스택
      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);

      // 토스트 메시지 상태
      const [saveToast, setSaveToast] = useState(null);
      const toastTimerRef = useRef(null);

      const triggerToast = (msg, icon = 'check-circle') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setSaveToast({ msg, icon });
        toastTimerRef.current = setTimeout(() => setSaveToast(null), 3000);
      };

      const takeSnapshot = () => {
        const snapshot = {
          pageTitle, pageSubtitle, startAge, startYear,
          defaultReturn, defaultSavings, goalTitle, goalQuote,
          savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode
        };
        setUndoStack(prev => [...prev.slice(-49), snapshot]); // 최대 50개 저장
        setRedoStack([]);
      };

      const applySnapshot = (snapshot) => {
        setPageTitle(snapshot.pageTitle);
        setPageSubtitle(snapshot.pageSubtitle);
        setStartAge(snapshot.startAge);
        setStartYear(snapshot.startYear);
        setDefaultReturn(snapshot.defaultReturn);
        setDefaultSavings(snapshot.defaultSavings);
        setGoalTitle(snapshot.goalTitle);
        setGoalQuote(snapshot.goalQuote);
        setSavingsUnit(snapshot.savingsUnit);
        setAllRows(snapshot.allRows);
        setYearDataStore(snapshot.yearDataStore);
        setItems(snapshot.items);
        setRoadmapYears(snapshot.roadmapYears || 30);
        setDarkMode(snapshot.darkMode);
      };

      const handleUndo = () => {
        if (undoStack.length === 0) return;
        const current = {
          pageTitle, pageSubtitle, startAge, startYear,
          defaultReturn, defaultSavings, goalTitle, goalQuote,
          savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode
        };
        const previous = undoStack[undoStack.length - 1];
        setRedoStack(prev => [...prev, current]);
        setUndoStack(prev => prev.slice(0, -1));
        applySnapshot(previous);
      };

      const handleRedo = () => {
        if (redoStack.length === 0) return;
        const current = {
          pageTitle, pageSubtitle, startAge, startYear,
          defaultReturn, defaultSavings, goalTitle, goalQuote,
          savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode
        };
        const next = redoStack[redoStack.length - 1];
        setUndoStack(prev => [...prev, current]);
        setRedoStack(prev => prev.slice(0, -1));
        applySnapshot(next);
      };

      // 로컬 스토리지 저장 로직 제거 (클라우드 전용)
      /* useEffect(() => { ... }, [yearDataStore]); 삭제됨 */

      const [history, setHistory] = useState([]);

      const createBackup = async (isAuto = false) => {
        // [중요] 최신 상태(Ref)를 사용하여 스냅샷 생성
        const currentData = latestStateRef.current;
        const snapshot = {
          id: Date.now(),
          timestamp: new Date().toLocaleString('ko-KR', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          }),
          isAuto,
          data: currentData
        };

        // 로컬 히스토리(메모리) 업데이트
        setHistory(prev => {
          const newHistory = [snapshot, ...prev].slice(0, 100);
          return newHistory;
        });

        // 클라우드 저장
        if (currentUser) {
          try {
            await saveToFirestore(currentUser, snapshot.data);
            if (!isAuto) {
              triggerToast("클라우드 저장 완료");
            }
          } catch (e) {
            console.error("Cloud save failed:", e);
            if (!isAuto) {
              setModalState({ type: 'status', data: { title: "⚠️ 클라우드 저장 실패", msg: `오류가 발생했습니다: ${e.message}\n(Firebase 보안 규칙 혹은 용량 초과를 확인하세요)`, icon: "alert-triangle" } });
            }
          }
        } else {
          // 비로그인 상태면 경고
          if (!isAuto) {
            triggerToast("임시 저장 완료 (비로그인)", "alert-circle");
          }
        }
      };

      const restoreBackup = (backup) => {
        const { data } = backup;
        setPageTitle(data.pageTitle);
        setPageSubtitle(data.pageSubtitle);
        setStartAge(data.startAge);
        setStartYear(data.startYear);
        setDefaultReturn(data.defaultReturn);
        setDefaultSavings(data.defaultSavings);
        setGoalTitle(data.goalTitle);
        setGoalQuote(data.goalQuote);
        setSavingsUnit(data.savingsUnit);
        setAllRows(data.allRows);
        setItems(data.items);
        setDarkMode(data.darkMode);
        closeModal();
        setModalState({ type: 'status', data: { title: "복구 완료", msg: `${backup.timestamp} 시점의 데이터로 복구되었습니다.`, icon: "refresh-cw" } });
      };

      // 단축키 및 자동 저장
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            e.stopPropagation();
            createBackup(false);
          }
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
            e.preventDefault();
            handleUndo();
          }
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z') {
            e.preventDefault();
            handleRedo();
          }
        };
        window.addEventListener('keydown', handleKeyDown);

        // 5분마다 자동 저장
        const autoSaveTimer = setInterval(() => {
          createBackup(true);
        }, 5 * 60 * 1000);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          clearInterval(autoSaveTimer);
        };
      }, [pageTitle, pageSubtitle, startAge, startYear, defaultReturn, defaultSavings, goalTitle, goalQuote, savingsUnit, allRows, items, darkMode]);

      const handleLogout = async () => {
        if (!window.fb) return;
        try {
          // [중요] 로그아웃 전 마지막 데이터 자동 저장
          setModalState({ type: 'status', data: { title: "로그아웃 중", msg: "데이터를 안전하게 저장하고 있습니다...", icon: "save", animate: true } });

          if (currentUser) {
            await createBackup(true);
          }

          await window.fb.signOut(window.fb.auth);
          setCurrentUser(null);
          resetState();
          setModalState({ type: 'status', data: { title: "로그아웃", msg: "데이터를 저장하고 안전하게 로그아웃 되었습니다.", icon: "check-circle" } });
        } catch (error) {
          console.error("Logout failed", error);
          setModalState({ type: 'status', data: { title: "오류", msg: "로그아웃 중 문제가 발생했습니다.", icon: "alert-triangle" } });
        }
      };

      const calculateProfit = (item) => {
        const beg = Number(item.beginningAssets) || 0;
        const retPercent = Number(item.targetReturn) || 0;
        return Math.round(beg * (retPercent / 100));
      };

      const calculateYearEndAssets = (item) => {
        const beg = Number(item.beginningAssets) || 0;
        const sav = Number(item.savings) || 0;
        const profit = calculateProfit(item);

        let total = beg + profit + sav;

        // 추가된 숫자 행들 중 연산 설정된 항목 반영
        allRows.forEach(row => {
          if (row.type === 'number' && !row.isSystem && row.operator) {
            const val = Number(item.dynamicData?.[row.id]) || 0;
            if (row.operator === 'add') total += val;
            else if (row.operator === 'subtract') total -= val;
          }
        });

        return Math.round(total);
      };

      const [items, setItems] = useState(() => {
        const arr = Array.from({ length: roadmapYears }, (_, i) => {
          const year = startYear + i;
          const store = yearDataStore?.[year] || {};
          return {
            beginningAssets: store.beginningAssets !== undefined ? store.beginningAssets : 0,
            savings: store.savings !== undefined ? store.savings : 820,
            targetReturn: store.targetReturn !== undefined ? store.targetReturn : 15,
            dynamicData: store.dynamicData || {}
          };
        });
        // Removed forced initialization of beginningAssets
        for (let i = 0; i < arr.length - 1; i++) {
          arr[i + 1].beginningAssets = calculateYearEndAssets(arr[i]);
        }
        return arr;
      });

      // 비동기 저장에서도 사용자가 확장한 전체 기간을 포함한 최신 상태를 참조합니다.
      const latestStateRef = useRef({
        pageTitle, pageSubtitle, startAge, startYear,
        defaultReturn, defaultSavings, goalTitle, goalQuote,
        savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode
      });

      useEffect(() => {
        latestStateRef.current = {
          pageTitle, pageSubtitle, startAge, startYear,
          defaultReturn, defaultSavings, goalTitle, goalQuote,
          savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode
        };
      }, [pageTitle, pageSubtitle, startAge, startYear, defaultReturn, defaultSavings, goalTitle, goalQuote, savingsUnit, allRows, yearDataStore, items, roadmapYears, darkMode]);

      // 연도 이동 시 데이터 복원 및 동기화 (연속성 확보 버전)
      useEffect(() => {
        setItems(prev => {
          // 1. 기준연도(2026)부터 마지막 가용 연도까지의 전역 데이터 흐름 계산
          const baseYear = 2026;
          const endYear = startYear + roadmapYears - 1;
          const fullTimeline = {};

          // 시뮬레이션: 기준점부터 현재 화면 끝까지 계산
          let currentBeg = yearDataStore[baseYear]?.beginningAssets !== undefined ? yearDataStore[baseYear].beginningAssets : 0;

          for (let y = baseYear; y <= endYear; y++) {
            const store = yearDataStore[y] || {};
            const sav = store.savings !== undefined ? store.savings : defaultSavings;
            const ret = store.targetReturn !== undefined ? store.targetReturn : defaultReturn;

            // 만약 해당 연도에 수동으로 연초자산을 넣었다면 해당 값 사용
            if (store.beginningAssets !== undefined) currentBeg = store.beginningAssets;

            const profit = Math.round(currentBeg * (ret / 100));
            const yearEnd = Math.round(currentBeg + profit + sav);

            // 중요: allRows를 순회하며 dynamicData에 따른 추가 연산 수행
            let finalYearEnd = yearEnd;
            if (store.dynamicData) {
              allRows.forEach(row => {
                if (row.type === 'number' && !row.isSystem && row.operator) {
                  const val = Number(store.dynamicData[row.id]) || 0;
                  if (row.operator === 'add') finalYearEnd += val;
                  else if (row.operator === 'subtract') finalYearEnd -= val;
                }
              });
            }

            fullTimeline[y] = {
              beginningAssets: currentBeg,
              savings: sav,
              targetReturn: ret,
              yearEndAssets: finalYearEnd,
              dynamicData: store.dynamicData || {}
            };

            // 다음 연도의 연초 자산은 현재 연도의 연말 자산
            currentBeg = finalYearEnd;
          }

          // 2. 현재 startYear 시점에 해당하는 사용자 설정 기간 데이터 슬라이싱
          const newItems = Array.from({ length: roadmapYears }, (_, i) => {
            const year = startYear + i;
            // yearDataStore에 있는 데이터가 우선
            const calculated = fullTimeline[year];
            if (calculated) return calculated;

            return {
              beginningAssets: 0,
              investedAssets: 0,
              savings: defaultSavings,
              targetReturn: defaultReturn,
              dynamicData: {}
            };
          });

          return newItems;
        });
      }, [startYear, defaultReturn, defaultSavings, yearDataStore, allRows, roadmapYears]);

      const [modalState, setModalState] = useState({
        type: null, // 'header', 'addRow', 'editRow'
        data: null
      });

      const [draggedRowIndex, setDraggedRowIndex] = useState(null);
      const [globalRowHeight, setGlobalRowHeight] = useState(80);

      const startResizing = (e) => {
        e.preventDefault();
        const startY = e.pageY;
        const startHeight = globalRowHeight;

        const onMouseMove = (moveEvent) => {
          const deltaY = moveEvent.pageY - startY;
          setGlobalRowHeight(Math.max(40, startHeight + deltaY));
        };

        const onMouseUp = () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          document.body.style.cursor = 'default';
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        document.body.style.cursor = 'row-resize';
      };

      // (기존 useEffect는 위로 통합됨)

      const closeModal = () => setModalState({ type: null, data: null });

      const updateItem = (index, field, value) => {
        takeSnapshot();
        const year = startYear + index;
        const val = ['beginningAssets', 'savings', 'targetReturn'].includes(field) ? (Number(value) || 0) : value;

        // 마스터 저장소 업데이트
        setYearDataStore(prev => ({
          ...prev,
          [year]: { ...prev[year], [field]: val }
        }));

        setItems(prev => {
          const newItems = prev.map((item, i) => {
            if (i === index) return { ...item, [field]: val };
            return item;
          });

          // 캐스케이드 계산 (불변성 유지)
          for (let i = index; i < newItems.length - 1; i++) {
            const nextYear = startYear + i + 1;
            // 다음 연도에 수동 입력된 연초자산(override)이 없을 때만 캐스케이드 진행
            if (yearDataStore[nextYear]?.beginningAssets === undefined || i === index) {
              const nextBegValue = calculateYearEndAssets(newItems[i]);
              if (newItems[i + 1].beginningAssets !== nextBegValue) {
                newItems[i + 1] = { ...newItems[i + 1], beginningAssets: nextBegValue };
              } else {
                // 값이 같다면 이후 변화가 없으므로 중단 가능 (최적화)
                if (i > index) break;
              }
            } else {
              break; // 수동 입력값을 만나면 캐스케이드 중단
            }
          }
          return newItems;
        });
      };

      const updateDynamicData = (index, rowId, value) => {
        takeSnapshot();
        const year = startYear + index;

        // 해당 행이 연산(+, -)에 참여하는 행인지 확인
        const rowDef = allRows.find(r => r.id === rowId);
        const isOperand = rowDef && rowDef.type === 'number' && rowDef.operator;
        const val = rowDef && rowDef.type === 'number' ? (Number(value) || 0) : value;

        // [중요] 마스터 데이터 스토어(yearDataStore) 업데이트
        setYearDataStore(prev => {
          const currentYearStore = prev[year] || {};
          return {
            ...prev,
            [year]: {
              ...currentYearStore,
              dynamicData: {
                ...(currentYearStore.dynamicData || {}),
                [rowId]: val
              }
            }
          };
        });

        // UI 즉시 업데이트 (setItems)
        setItems(prev => {
          const newItems = prev.map((item, i) => {
            if (i === index) {
              return {
                ...item,
                dynamicData: { ...item.dynamicData, [rowId]: val }
              };
            }
            return item;
          });

          // 자산 연산에 참여하는 행인 경우, 미래 연도들의 연초자산 가로질러 계산(Cascade)
          if (isOperand) {
            for (let i = index; i < newItems.length - 1; i++) {
              const nextYear = startYear + i + 1;
              // 다음 연도에 수동 입력된 연초자산(override)이 없을 때만 캐스케이드 진행
              if (yearDataStore[nextYear]?.beginningAssets === undefined) {
                const nextBegValue = calculateYearEndAssets(newItems[i]);
                if (newItems[i + 1].beginningAssets !== nextBegValue) {
                  newItems[i + 1] = { ...newItems[i + 1], beginningAssets: nextBegValue };
                } else {
                  break; // 값이 동일하면 이후는 변화가 없으므로 중단
                }
              } else {
                break; // 수동 입력값을 만나면 중단
              }
            }
          }
          return newItems;
        });
      };



      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 1000; // 가로 최대 1000px
              const MAX_HEIGHT = 1000; // 세로 최대 1000px
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // 0.7 퀄리티의 JPEG로 압축 (용량 대폭 감소)
              const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
              resolve(dataUrl);
            };
            img.onerror = reject;
          };
          reader.onerror = reject;
        });
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file && activeCell !== null) {
          try {
            // 이미지 압축 중 상태 표시
            setModalState({ type: 'status', data: { title: "이미지 압축 중", msg: "이미지를 최적화하고 있습니다. 잠시만 기다려주세요...", icon: "loader", animate: true } });

            const compressed = await compressImage(file);
            updateDynamicData(activeCell.index, activeCell.rowId, compressed);
            closeModal(); // 완료 후 모달 닫기 (setModalState(null) 사용 시 렌더링 에러 발생 가능하여 수정)
          } catch (error) {
            console.error("Image processing error:", error);
            setModalState({ type: 'status', data: { title: "처리 오류", msg: "이미지 압축 중 오류가 발생했습니다.", icon: "alert-triangle" } });
          } finally {
            setActiveCell(null);
          }
        }
        e.target.value = null;
      };

      const triggerFileInput = (index, rowId) => {
        setActiveCell({ index, rowId });
        fileInputRef.current?.click();
      };

      const removeImage = (e, index, rowId) => {
        e.stopPropagation();
        updateDynamicData(index, rowId, "");
      };

      const moveRow = (id, direction) => {
        const index = allRows.findIndex(r => r.id === id);
        if ((direction === 'up' && index === 0) || (direction === 'down' && index === allRows.length - 1)) return;

        const newRows = [...allRows];
        const swapIndex = direction === 'up' ? index - 1 : index + 1;
        [newRows[index], newRows[swapIndex]] = [newRows[swapIndex], newRows[index]];
        setAllRows(newRows);
      };

      const updateRowLabel = (id, newLabel) => {
        setAllRows(prev => prev.map(r => r.id === id ? { ...r, label: newLabel } : r));
      };

      const deleteRow = (id) => {
        const isSystem = ['beginningAssets', 'investedAssets', 'targetReturn', 'savings', 'yearEndAssets'].includes(id);
        const msg = isSystem
          ? '이 행은 가계산 로직이 포함된 기본 행입니다.\n정말 삭제하시겠습니까?'
          : '선택한 행을 로드맵에서 삭제하시겠습니까?';

        setModalState({ type: 'confirmDelete', data: { id, msg, isSystem } });
      };

      const addRow = (label, type, operator) => {
        takeSnapshot();
        const newId = `row_${Date.now()}`;
        setAllRows(prev => [...prev, { id: newId, label, type, operator }]);
      };

      const updateRowInfo = (id, label, type, operator) => {
        takeSnapshot();
        setAllRows(prev => prev.map(r => r.id === id ? { ...r, label, type, operator } : r));
      };

      const executeDelete = () => {
        if (modalState.data?.id) {
          setAllRows(prev => prev.filter(r => r.id !== modalState.data.id));
          closeModal();
        }
      };

      const onDragStart = (e, index) => {
        setDraggedRowIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const onDragOver = (e) => {
        e.preventDefault();
      };

      const onDrop = (e, index) => {
        e.preventDefault();
        if (draggedRowIndex === null || draggedRowIndex === index) return;

        const newRows = [...allRows];
        const item = newRows.splice(draggedRowIndex, 1)[0];
        newRows.splice(index, 0, item);

        setAllRows(newRows);
        setDraggedRowIndex(null);
      };



      const handleAutoHeight = (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = `${e.target.scrollHeight}px`;
      };

      const downloadImage = async () => {
        const container = roadmapRef.current;
        if (!container) return;

        if (!window.html2canvas) {
          const script = document.createElement('script');
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
          script.onload = () => executeDownloadSplit(container);
          document.head.appendChild(script);
        } else {
          executeDownloadSplit(container);
        }
      };

      const executeDownloadSplit = async (container) => {
        // 1. 헤더 영역 (제목, 상단 정보, 목표) 캡처 준비
        // 2. 10년 단위 테이블 블록들을 찾음
        const tables = container.querySelectorAll('.mb-8.md\\:mb-12.overflow-hidden.rounded-\\[1\\.5rem\\]');
        if (tables.length === 0) return;

        setModalState({ type: 'status', data: { title: "이미지 생성 중", msg: `${tables.length}개의 테이블 블록을 개별 이미지로 저장합니다...`, icon: "loader", animate: true } });

        // 첫 번째 이미지에는 상단 정보(헤더+목표)를 포함할지 여부 결정
        // 여기서는 각 테이블 블록만 깔끔하게 저장하는 방식으로 구현
        for (let i = 0; i < tables.length; i++) {
          const tableBlock = tables[i];
          const yearText = tableBlock.querySelector('h2')?.textContent?.trim() || `Part_${i + 1}`;
          const safeFileName = yearText.replace(/[^a-z0-9가-힣_\-~ ]/gi, '_');

          await html2canvas(tableBlock, {
            scale: 3,
            useCORS: true,
            backgroundColor: darkMode ? '#0f172a' : '#ffffff',
            logging: false,
            onclone: (clonedDoc) => {
              // 캡처용 스타일 보정 (Input -> Div 변환 등)
              const clonedBlock = clonedDoc.body.querySelector('.mb-8.md\\:mb-12.overflow-hidden.rounded-\\[1\\.5rem\\]'); // 예시 선택자
              // 실제로는 html2canvas가 넘겨받은 block을 기준으로 렌더링하므로 
              // onclone 내부에서 clonedDoc을 통해 해당 요소의 하위 엘리먼트들을 전역적으로 수정 가능

              const inputs = clonedDoc.querySelectorAll('input, textarea');
              inputs.forEach(input => {
                const parent = input.parentElement;
                if (parent) {
                  const displayDiv = clonedDoc.createElement('div');
                  displayDiv.textContent = input.value;
                  displayDiv.className = input.className;
                  displayDiv.style.cssText = window.getComputedStyle(input).cssText;
                  displayDiv.style.display = 'block';
                  displayDiv.style.whiteSpace = 'pre-wrap';
                  displayDiv.style.wordBreak = 'break-all';
                  displayDiv.style.textAlign = input.classList.contains('text-right') ? 'right' : 'center';
                  input.style.display = 'none';
                  parent.appendChild(displayDiv);
                }
              });

              // 이미지 라이브러리/다운로드 시 공란 처리 (placeholder 숨기기)
              const placeholders = clonedDoc.querySelectorAll('.img-placeholder');
              placeholders.forEach(p => {
                p.style.display = 'none';
              });

              const tbls = clonedDoc.querySelectorAll('table');
              tbls.forEach(t => {
                t.style.width = '100%';
                t.style.minWidth = '0';
                t.style.tableLayout = 'fixed';
              });
            }
          }).then(canvas => {
            const link = document.createElement('a');
            link.download = `인생로드맵_${safeFileName}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
          });

          // 다운로드 사이 간격
          await new Promise(resolve => setTimeout(resolve, 500));
        }

        setModalState({ type: 'status', data: { title: "저장 완료", msg: `${tables.length}개의 조각 이미지가 다운로드되었습니다.`, icon: "check-circle" } });
      };

      const downloadExcel = async () => {
        try {
          const Excel = window.ExcelJS || (typeof ExcelJS !== 'undefined' ? ExcelJS : null);
          if (!Excel) {
            setModalState({ type: 'status', data: { title: "오류 발생", msg: "엑셀 라이브러리가 로드되지 않았습니다. 페이지를 새로고침 해주세요.", icon: "alert-circle" } });
            return;
          }

          setModalState({ type: 'status', data: { title: "파일 생성 중", msg: "엑셀 파일 생성을 시작합니다. 이미지가 많을 경우 수 초 정도 걸릴 수 있습니다.", icon: "loader", animate: true } });

          const workbook = new Excel.Workbook();
          const worksheet = workbook.addWorksheet('인생 로드맵');

          // 기본 스타일 설정
          worksheet.properties.defaultRowHeight = 25;

          // 1. 문서 요약 정보 (최상단)
          const titleRow = worksheet.addRow([pageTitle]);
          titleRow.font = { size: 18, bold: true, color: { argb: 'FFAF1D42' } };

          const subTitleRow = worksheet.addRow([pageSubtitle]);
          subTitleRow.font = { size: 12, italic: true };

          worksheet.addRow([]);
          worksheet.addRow(['[나의 목표]', goalTitle]).font = { bold: true };
          worksheet.addRow(['[나의 명언]', goalQuote]).font = { italic: true };
          worksheet.addRow([]);
          worksheet.addRow(['[기준 정보]', `시작 연도: ${startYear}년 / 시작 나이: ${startAge}세 / 화폐 단위: ${savingsUnit}`]);
          worksheet.addRow([`* 참고: ${roadmapYears}년 인생 시나리오가 10년 단위로 구성되어 있습니다.`]);
          worksheet.addRow([]);

          // 2. 메인 데이터 테이블 구성 (사용자 설정 기간을 10년씩 분할)
          for (const blockStartIndex of Array.from({ length: roadmapYears / 10 }, (_, i) => i * 10)) {
            const chunk = items.slice(blockStartIndex, blockStartIndex + 10);

            // 각 블록의 헤더
            const headerValues = ['구분', ...chunk.map((_, i) => `${startYear + blockStartIndex + i}년 (${startAge + blockStartIndex + i}세)`)];
            const headerRow = worksheet.addRow(headerValues);

            headerRow.eachCell((cell) => {
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFAF1D42' } };
              cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
              cell.alignment = { horizontal: 'center', vertical: 'middle' };
              cell.border = {
                top: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                left: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                bottom: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                right: { style: 'thin', color: { argb: 'FFEBEDF0' } }
              };
            });

            // 행별 데이터 구성
            for (const rowDef of allRows) {
              const rowValues = [rowDef.label];
              const isImageRow = rowDef.type === 'image';

              chunk.forEach((item) => {
                if (rowDef.id === 'yearEndAssets') {
                  rowValues.push(calculateYearEndAssets(item));
                } else if (rowDef.id === 'profit') {
                  rowValues.push(calculateProfit(item));
                } else if (rowDef.id === 'targetReturn') {
                  rowValues.push(`${item.targetReturn}%`);
                } else if (rowDef.isSystem) {
                  rowValues.push(item[rowDef.id] || 0);
                } else if (isImageRow) {
                  rowValues.push(""); // 이미지가 들어갈 자리는 비워둠
                } else {
                  rowValues.push(item.dynamicData?.[rowDef.id] || '');
                }
              });

              const newRow = worksheet.addRow(rowValues);

              // 행 스타일 및 이미지 삽입
              newRow.eachCell((cell, colNumber) => {
                cell.alignment = { vertical: 'middle', horizontal: colNumber === 1 ? 'center' : 'right', wrapText: true };
                cell.border = {
                  top: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                  left: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                  bottom: { style: 'thin', color: { argb: 'FFEBEDF0' } },
                  right: { style: 'thin', color: { argb: 'FFEBEDF0' } }
                };
                if (colNumber === 1) cell.font = { bold: true };
              });

              if (isImageRow) {
                newRow.height = 120; // 이미지 행 높이 크게 설정
                chunk.forEach((item, chunkIdx) => {
                  const imgData = item.dynamicData?.[rowDef.id];
                  if (imgData && imgData.includes('base64,')) {
                    try {
                      const base64Content = imgData.split('base64,')[1];
                      const imageId = workbook.addImage({
                        base64: base64Content,
                        extension: 'png',
                      });
                      worksheet.addImage(imageId, {
                        tl: { col: chunkIdx + 1, row: newRow.number - 1 },
                        br: { col: chunkIdx + 2, row: newRow.number },
                        editAs: 'oneCell'
                      });
                    } catch (e) {
                      console.error("이미지 삽입 실패", e);
                    }
                  }
                });
              }
            }

            // 블록 사이 간격
            worksheet.addRow([]);
            worksheet.addRow([]);
          }

          // 전체 열 너비 설정
          worksheet.columns.forEach((col, i) => {
            col.width = i === 0 ? 25 : 18;
            if (i > 0) {
              col.alignment = { horizontal: 'center', vertical: 'middle' };
            }
          });

          // 파일 다운로드
          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `인생_로드맵_${roadmapYears}년_이미지포함.xlsx`;
          link.click();
          window.URL.revokeObjectURL(url);
          setModalState({ type: 'status', data: { title: "저장 완료", msg: "이미지가 포함된 엑셀 파일 다운로드가 완료되었습니다!", icon: "check-circle" } });
        } catch (error) {
          console.error("엑셀 다운로드 오류:", error);
          setModalState({ type: 'status', data: { title: "오류 발생", msg: `엑셀 생성 중 오류가 발생했습니다: ${error.message}`, icon: "alert-triangle" } });
        }
      };


      const renderTable = (startIndex) => {
        const chunk = items.slice(startIndex, startIndex + 10);
        const borderColor = darkMode ? 'border-slate-700' : 'border-slate-300';
        const headerBg = darkMode ? 'bg-brand-800' : 'bg-brand-600';
        const rowHeaderBg = darkMode ? 'bg-slate-800/80' : 'bg-slate-50';

        return (
          <div className={`mb-8 md:mb-12 overflow-hidden rounded-[1.5rem] md:rounded-[2.5rem] shadow-sm border ${borderColor} p-4 md:p-6 ${darkMode ? 'bg-slate-900 shadow-brand-950/20' : 'bg-white'} transition-all`}>
            <div className="flex items-center justify-between mb-4 md:mb-6 px-2">
              <h2 className={`text-xl md:text-3xl font-black flex items-center gap-4 ${darkMode ? 'text-brand-300' : 'text-brand-700'} tracking-tighter`}>
                <span className="text-3xl md:text-4xl drop-shadow-md">👑</span>
                {startYear + startIndex}년 ~ {startYear + startIndex + 9}년
              </h2>
            </div>

            {/* 상단 스크롤바 (하단과 동기화) */}
            <div
              id={`top-scroll-${startIndex}`}
              data-html2canvas-ignore="true"
              onScroll={(e) => {
                const bottom = document.getElementById(`table-container-${startIndex}`);
                if (bottom) bottom.scrollLeft = e.target.scrollLeft;
              }}
              className="overflow-x-auto custom-scrollbar h-2 mb-1"
            >
              <div style={{ width: '1400px', height: '1px' }}></div>
            </div>

            <div
              id={`table-container-${startIndex}`}
              onScroll={(e) => {
                const top = document.getElementById(`top-scroll-${startIndex}`);
                if (top) top.scrollLeft = e.target.scrollLeft;
              }}
              className="overflow-x-auto custom-scrollbar pb-2"
            >
              <table className={`w-full border-collapse border border-slate-200 dark:border-brand-900/30 text-[11px] table-fixed min-w-[1400px]`}>
                <thead>
                  <tr className={`${headerBg} text-white shadow-lg relative`}>
                    <th className={`border border-white/10 p-4 w-44 text-sm font-black uppercase tracking-tighter relative group/header`}>
                      구분
                      <div
                        onMouseDown={startResizing}
                        className="absolute bottom-0 left-0 w-full h-1.5 cursor-row-resize bg-white/20 hover:bg-white/40 opacity-0 group-hover/header:opacity-100 transition-opacity z-10"
                        title="드래그하여 행 높이 조절"
                      ></div>
                    </th>
                    {chunk.map((_, i) => (
                      <th key={i} className={`border border-white/10 p-2 text-center`}>
                        <div className="text-xl font-black">{startYear + startIndex + i}년</div>
                        <div className="text-xs opacity-80 font-bold uppercase">{startAge + startIndex + i}세</div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {allRows.map((row, rowIndex) => {
                    const isYearEnd = row.id === 'yearEndAssets';
                    const rowBg = isYearEnd ? (darkMode ? 'bg-brand-900/40' : 'bg-brand-50') : 'transition-colors hover:bg-slate-500/5';
                    const textColor = isYearEnd ? (darkMode ? 'text-brand-300' : 'text-brand-700 font-black') : 'text-slate-700 dark:text-slate-200';

                    return (
                      <tr
                        key={row.id}
                        draggable
                        onDragStart={(e) => onDragStart(e, rowIndex)}
                        onDragOver={onDragOver}
                        onDrop={(e) => onDrop(e, rowIndex)}
                        className={`${rowBg} cursor-move`}
                        style={{ height: `${row.isSystem ? Math.max(40, globalRowHeight * 0.5) : globalRowHeight}px` }}
                      >
                        <td className={`${rowHeaderBg} border ${borderColor} p-3 font-black text-center text-sm relative group align-middle overflow-hidden`}>
                          <div className={`flex flex-col items-center justify-center gap-2 h-full relative`}>
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 text-slate-300 opacity-20 group-hover:opacity-100 transition-opacity pointer-events-none">
                              <Icon name="grip-vertical" size={16} />
                            </div>

                            <div className="flex items-center justify-center gap-2">
                              {row.operator === 'add' && <span className="bg-emerald-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-sm">+</span>}
                              {row.operator === 'subtract' && <span className="bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-sm">-</span>}
                              <input
                                value={row.label}
                                onChange={(e) => updateRowLabel(row.id, e.target.value)}
                                onClick={(e) => e.stopPropagation()}
                                spellCheck="false"
                                className="w-full bg-transparent text-center outline-none border-b border-transparent focus:border-brand-500 transition-all pb-1 break-all leading-tight cursor-text text-slate-800 dark:text-slate-100 z-10"
                              />
                            </div>
                          </div>
                        </td>
                        {chunk.map((item, i) => {
                          const globalIdx = startIndex + i;
                          let content;

                          if (row.id === 'yearEndAssets') {
                            content = (
                              <div className="p-2 text-right font-black text-[15px]">
                                {calculateYearEndAssets(item).toLocaleString()}
                              </div>
                            );
                          } else if (row.id === 'profit') {
                            content = (
                              <div className="p-2 text-right font-black text-[15px] text-emerald-600 dark:text-emerald-400">
                                {calculateProfit(item).toLocaleString()}
                              </div>
                            );
                          } else if (row.type === 'number' || row.id === 'beginningAssets' || row.id === 'savings') {
                            const val = row.isSystem ? item[row.id] : item.dynamicData?.[row.id];
                            content = (
                              <input
                                type="text"
                                value={row.isSystem ? (Number(val) === 0 ? "" : Number(val).toLocaleString()) : (item.dynamicData?.[row.id] || "")}
                                onChange={(e) => {
                                  const cleaned = e.target.value.replace(/,/g, '').replace(/[^0-9.\-]/g, '');
                                  row.isSystem
                                    ? updateItem(globalIdx, row.id, cleaned)
                                    : updateDynamicData(globalIdx, row.id, cleaned);
                                }}
                                spellCheck="false"
                                className={`w-full text-right p-1 bg-transparent pr-3 outline-none font-black text-[15px] ${row.id === 'savings' ? 'text-orange-500 dark:text-orange-400' :
                                  row.operator === 'add' ? 'text-emerald-600 dark:text-emerald-400' :
                                    row.operator === 'subtract' ? 'text-red-500 dark:text-red-400' :
                                      'text-slate-700 dark:text-white'
                                  }`}
                              />
                            );
                          } else if (row.id === 'targetReturn') {
                            content = (
                              <div className="flex items-center justify-end w-full px-2 group/input">
                                <input
                                  type="text"
                                  value={item.targetReturn}
                                  onChange={(e) => {
                                    const cleaned = e.target.value.replace(/[^0-9.]/g, '');
                                    updateItem(globalIdx, 'targetReturn', cleaned);
                                  }}
                                  spellCheck="false"
                                  className="w-12 text-right p-1 font-black bg-transparent outline-none text-emerald-500 dark:text-emerald-400 text-[15px]"
                                />
                                <span className="text-emerald-500 dark:text-emerald-400 font-extrabold text-[15px] leading-none">%</span>
                              </div>
                            );
                          } else if (row.type === 'image') {
                            const cellData = item.dynamicData?.[row.id];
                            content = (
                              <div
                                onClick={() => cellData ? setModalState({ type: 'previewImage', data: cellData }) : triggerFileInput(globalIdx, row.id)}
                                className={`w-full min-h-[90px] relative group border-2 border-dashed rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all overflow-hidden ${cellData ? 'border-transparent' : (darkMode ? 'border-slate-700 hover:border-slate-500 bg-slate-900 shadow-inner' : 'border-slate-200 hover:border-slate-300 bg-slate-50')}`}
                              >
                                {cellData ? (
                                  <>
                                    <img src={cellData} className="w-full h-full object-cover transition-transform group-hover:scale-105" />
                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2">
                                      <div className="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full text-white text-[10px] font-black border border-white/30">클릭 확대</div>
                                      <button onClick={(e) => { e.stopPropagation(); removeImage(e, globalIdx, row.id); }} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-2 text-[10px] font-black mt-2">삭제</button>
                                    </div>
                                  </>
                                ) : (
                                  <div className="img-placeholder flex flex-col items-center justify-center">
                                    <Icon name="plus" size={14} className="text-slate-300 mb-1" />
                                    <span className="text-[10px] font-bold text-slate-400">이미지 추가</span>
                                  </div>
                                )}
                              </div>
                            );
                          } else {
                            const cellData = item.dynamicData?.[row.id] || "";
                            content = (
                              <textarea
                                value={cellData}
                                onChange={(e) => { updateDynamicData(globalIdx, row.id, e.target.value); handleAutoHeight(e); }}
                                placeholder="입력..."
                                spellCheck="false"
                                className="w-full min-h-[100px] p-3 text-[12px] bg-transparent resize-none outline-none overflow-hidden font-medium leading-relaxed scrollbar-hide focus:bg-brand-500/5 dark:focus:bg-brand-500/10 rounded-xl transition-all text-slate-700 dark:text-white"
                              />
                            );
                          }

                          return (
                            <td key={i} className={`border ${borderColor} p-1 align-middle`}>
                              {content}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      if (isAuthChecking) {
        return (
          <div className="min-h-screen bg-brand-600 flex flex-col items-center justify-center gap-6 animate-pulse">
            <Icon name="loader" className="text-white animate-spin" size={60} />
            <p className="text-white text-xl font-bold tracking-widest opacity-90">데이터 동기화 중...</p>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-brand-600 flex flex-col items-center justify-center p-6 text-white text-center animate-in">
            <div className="w-full max-w-md space-y-10">
              <div className="space-y-4">
                <div className="w-24 h-24 bg-white/20 rounded-3xl mx-auto flex items-center justify-center backdrop-blur-sm mb-8 shadow-2xl">
                  <Icon name="map" size={48} className="text-white" />
                </div>
                <h1 className="text-4xl md:text-5xl font-black tracking-tighter drop-shadow-lg leading-tight">
                  당신의 30년<br /> <span className="text-brand-200">인생 로드맵</span>
                </h1>
                <p className="text-lg md:text-xl font-bold opacity-90 leading-relaxed break-keep">
                  미래를 구체적으로 계획하고 실현하세요. <br />
                  <span className="text-sm font-medium opacity-70 mt-4 block">
                    "당신의 30년 인생 로드맵으로 들어가보시겠습니까?"
                  </span>
                </p>
              </div>

              <div className="space-y-4 pt-8">
                <button
                  onClick={handleLogin}
                  className="w-full py-5 bg-white text-brand-600 rounded-2xl font-black text-xl shadow-[0_20px_40px_-10px_rgba(0,0,0,0.3)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                >
                  <Icon name="log-in" size={24} />
                  <span>구글 계정으로 시작하기</span>
                </button>      
              </div>
            </div>
            {/* 배경 장식 요소 */}
            <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none opacity-20">
              <div className="absolute -top-[20%] -left-[10%] w-[60vw] h-[60vw] bg-brand-400 rounded-full blur-[120px] mix-blend-screen animate-pulse-slow"></div>
              <div className="absolute top-[40%] -right-[10%] w-[50vw] h-[50vw] bg-brand-500 rounded-full blur-[100px] mix-blend-screen animate-pulse-slow" style={{ animationDelay: '1s' }}></div>
              <div className="absolute -bottom-[20%] left-[20%] w-[70vw] h-[70vw] bg-brand-800 rounded-full blur-[140px] mix-blend-overlay"></div>
            </div>
            {/* 모달: 상태 알림 (로그인 실패 시 등) */}
            <Modal
              isOpen={modalState?.type === 'status'}
              onClose={closeModal}
              title={modalState?.data?.title || "알림"}
            >
              <div className="space-y-6 text-center py-6 text-slate-800">
                <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 ${modalState?.data?.icon === 'check-circle' ? 'bg-emerald-100 text-emerald-500' :
                  modalState?.data?.icon === 'alert-triangle' || modalState?.data?.icon === 'alert-circle' ? 'bg-red-100 text-red-500' :
                    'bg-brand-100 text-brand-500'
                  }`}>
                  <Icon name={modalState?.data?.icon || "info"} size={40} className={modalState?.data?.animate ? "animate-spin" : ""} />
                </div>
                <p className="font-bold text-lg whitespace-pre-wrap leading-relaxed">
                  {modalState?.data?.msg}
                </p>
                <button
                  onClick={closeModal}
                  className="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-black text-lg shadow-xl transition-all"
                >
                  확인
                </button>
              </div>
            </Modal>
          </div>
        );
      }

      return (
        <div className={`min-h-screen transition-all ${darkMode ? 'dark bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`} style={{ fontFamily: 'NanumSquare, sans-serif' }}>
          <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />

          {/* 모달: 제목 편집 */}
          <Modal
            isOpen={modalState?.type === 'header'}
            onClose={closeModal}
            title="문서 제목 및 안내 수정"
          >
            <div className="space-y-6">
              <div>
                <label className="block text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">메인 제목</label>
                <input
                  type="text"
                  className="w-full p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 font-black text-lg outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100"
                  value={pageTitle}
                  onChange={e => setPageTitle(e.target.value)}
                />
              </div>
              <div>
                <label className="block text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">서브 안내 문구</label>
                <textarea
                  className="w-full p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 font-bold outline-none focus:ring-2 focus:ring-brand-500 min-h-[100px] text-slate-700 dark:text-slate-200"
                  value={pageSubtitle}
                  onChange={e => { setPageSubtitle(e.target.value); handleAutoHeight(e); }}
                />
              </div>
              <button onClick={closeModal} className="w-full py-4 bg-brand text-white rounded-2xl font-black text-lg shadow-xl shadow-brand/20 hover:scale-[1.02] transition-transform">저장하기</button>
            </div>
          </Modal>

          {/* 모달: 행 추가/수정 */}
          <Modal
            isOpen={modalState?.type === 'addRow' || modalState?.type === 'editRow'}
            onClose={closeModal}
            title={modalState?.type === 'addRow' ? '새로운 행 추가' : '행 정보 수정'}
          >
            <div className="space-y-6">
              <div>
                <label className="block text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">행 이름 (라벨)</label>
                <input
                  id="row-label-input"
                  type="text"
                  spellCheck="false"
                  className="w-full p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 font-black text-lg outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100"
                  defaultValue={modalState?.data?.label || ''}
                  placeholder="예: 라이프 플랜, 자기 개발"
                />
              </div>

              <div>
                <label className="block text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">데이터 타입</label>
                <div className="grid grid-cols-3 gap-3">
                  <button id="type-text" onClick={(e) => {
                    document.getElementById('type-text').classList.add('bg-brand-600', 'text-white', 'border-brand-600');
                    document.getElementById('type-number').classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
                    document.getElementById('type-image').classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
                    window._selectedType = 'textarea';
                    document.getElementById('operator-section').classList.add('hidden');
                  }} className={`py-4 rounded-2xl border font-black transition-all ${(!modalState?.data || modalState?.data?.type === 'textarea') ? 'bg-brand-600 text-white border-brand-600' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'}`}>텍스트</button>
                  <button id="type-number" onClick={(e) => {
                    document.getElementById('type-number').classList.add('bg-brand-600', 'text-white', 'border-brand-600');
                    document.getElementById('type-text').classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
                    document.getElementById('type-image').classList.remove('bg-brand-600', 'text-white', 'border-brand-600');

              </div>

              {/* 자산 계산 수식 및 시스템 안내 바 */}
              <div id="formula-section" className="mb-10 space-y-4">
                <div className="p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none relative overflow-hidden">
                  <div className="absolute left-0 top-0 w-2 h-full bg-brand-600"></div>

                  {/* 수식 영역 */}
                  <div className="flex flex-wrap items-center justify-center gap-4 md:gap-8 mb-8">
                    <div className="flex flex-col items-center gap-2">
                      <div className="bg-brand-50 dark:bg-brand-900/20 px-4 py-2 rounded-xl border border-brand-100 dark:border-brand-800">
                        <span className="font-black text-brand-700 dark:text-brand-300 text-base md:text-lg">연말자산</span>
                      </div>
                    </div>

                    <span className="text-2xl font-black text-slate-300 dark:text-slate-700">=</span>

                    <div className="flex flex-col items-center gap-2">
                      <span className="font-bold text-slate-600 dark:text-slate-400 text-sm md:text-base">연초자산</span>
                    </div>

                    <span className="text-2xl font-black text-brand-500/40">+</span>

                    <div className="flex flex-col items-center gap-1">
                      <div className="bg-emerald-500/10 dark:bg-emerald-500/20 px-4 py-2 rounded-xl border border-emerald-500/20">
                        <span className="font-black text-emerald-600 dark:text-emerald-400 text-sm md:text-base">수익금</span>
                      </div>
                      <span className="text-sm md:text-base text-slate-400 dark:text-slate-500 font-black">(연초자산 × 수익률)</span>
                    </div>

                    <span className="text-2xl font-black text-brand-500/40">+</span>

                    <div className="flex flex-col items-center gap-2">
                      <span className="font-bold text-orange-500 dark:text-orange-400 text-sm md:text-base">저축액</span>
                    </div>
                  </div>

                  {/* 설명 영역 (그리드) */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-slate-100 dark:border-slate-800 pt-6">
                    <div className="flex items-center gap-4 p-4 rounded-2xl bg-brand-500/5 border border-brand-500/10">
                      <div className="w-8 h-8 rounded-lg bg-brand-600 shrink-0 shadow-lg shadow-brand-600/20 flex items-center justify-center border border-brand-400">
                        {/* icon removed as per request */}
                      </div>
                      <div>
                        <h4 className="font-black text-slate-800 dark:text-white text-sm mb-1">실시간 자산 연동 시스템</h4>
                        <p className="text-slate-500 dark:text-slate-100 text-xs md:text-sm leading-relaxed font-medium">
                          올해의 <span className="text-brand-600 font-bold">연말자산</span>은 자동으로 내년도의 <span className="text-brand-600 font-bold">연초자산</span>으로 이월되어 30년 로드맵이 유기적으로 완성됩니다.
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-4 p-4 rounded-2xl bg-emerald-500/5 border border-emerald-500/10">
                      <div className="w-8 h-8 rounded-lg bg-emerald-500 shrink-0 shadow-lg shadow-emerald-500/20 flex items-center justify-center border border-emerald-400">
                        {/* icon removed as per request */}
                      </div>
                      <div>
                        <h4 className="font-black text-slate-800 dark:text-white text-sm mb-1">전 항목 자유로운 수기 수정</h4>
                        <p className="text-slate-500 dark:text-slate-100 text-xs md:text-sm leading-relaxed font-medium">
                          연초자산, 수익률, 저축액 등의 항목을 직접 수정할 수 있으며, 수정 시 이후 연도 데이터에 즉시 반영됩니다.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 시점 이동 컨트롤러 (표 바로 위로 이동) */}
              <div id="timeline-controller" className="mb-10 flex flex-wrap items-center justify-center gap-4 px-2 py-6 bg-slate-50 dark:bg-slate-900/50 rounded-[2rem] border border-dashed border-slate-200 dark:border-slate-800">
                <span className="text-sm font-black uppercase tracking-widest text-brand-600 dark:text-brand-400 mr-2 bg-brand-500/10 px-5 py-2 rounded-full border border-brand-500/20">로드맵 시점 이동</span>
                <div className="flex gap-3">
                  {[
                    { label: '1년 전', val: -1, icon: 'chevron-left', color: 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 border-slate-200 dark:border-slate-700' },
                    { label: '오늘', val: 0, icon: 'refresh-cw', color: 'bg-brand-600 text-white z-10 shadow-lg shadow-brand-500/20' },
                    { label: '1년 후', val: 1, icon: 'chevron-right', color: 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 border-slate-200 dark:border-slate-700' }
                  ].map(btn => (
                    <button
                      key={btn.label}
                      onClick={() => {
                        takeSnapshot();
                        if (btn.val === 0) {
                          const todayYear = new Date().getFullYear();
                          const diff = todayYear - startYear;
                          setStartYear(todayYear);
                          setStartAge(prev => prev + diff);
                        } else {
                          setStartYear(prev => prev + btn.val);
                          setStartAge(prev => prev + btn.val);
                        }
                      }}
                      className={`flex items-center justify-center px-6 py-3 rounded-2xl text-sm font-black transition-all active:scale-95 border ${btn.color} hover:border-brand-500 hover:scale-105 w-full md:w-auto`}
                    >
                      {btn.label}
                    </button>
                  ))}
                </div>
              </div>

              {Array.from({ length: roadmapYears / 10 }, (_, i) => i * 10).map(startIndex => renderTable(startIndex))}

              <div className="flex justify-center mt-2 mb-6" data-html2canvas-ignore="true">
                <button
                  onClick={() => {
                    takeSnapshot();
                    setRoadmapYears(prev => prev + 10);
                    triggerToast("로드맵에 10년이 추가되었습니다");
                  }}
                  className="bg-brand-600 hover:bg-brand-700 text-white px-7 py-3 rounded-2xl font-black flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95"
                >
                  <Icon name="plus" size={18} />
                  <span>10년 추가</span>
                </button>
              </div>
            </div>
          </div>

          {/* 실시간 알림 토스트 (오른쪽 상단) */}
          {saveToast && (
            <div className="fixed top-8 right-8 z-[100] animate-in slide-in-from-right-full">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-brand-900/40 shadow-2xl rounded-2xl px-6 py-4 flex items-center gap-4 min-w-[240px]">
                <div className={`p-2 rounded-xl ${saveToast.icon === 'alert-circle' ? 'bg-orange-100 text-orange-500' : 'bg-brand-100 text-brand-600'}`}>
                  <Icon name={saveToast.icon} size={24} />
                </div>
                <div>
                  <p className="text-sm font-black text-slate-800 dark:text-white leading-tight">{saveToast.msg}</p>
                  <p className="text-[10px] text-slate-400 font-bold mt-0.5">Cloud Synced</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
